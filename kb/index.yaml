# ECOM KNOWLEDGE BASE: routing index. Read this first; load only what the task bundle lists.
# Paths are relative to ~/council/kb/. Product state lives in ~/council/products/<slug>/.
# Source tags inside files: [c:MM-DD] call summary (_sources/calls/2026-MM-DD-*.pdf),
#   [d:slug] course doc (_sources/docs/slug.*), [b:schwartz] book,
#   [n:ball] Notion ECOM BALL KNOWLEDGE (_sources/notion/ecom-ball-knowledge.md + images-transcribed.md),
#   [n:dash] Notion dashboard pages (_sources/notion/dashboard-pages.md), [n:ecom-resources] Notion ECOM Resources.
# Owner notes [n:*] are the owner's own decisions: they outrank course docs where they conflict, except newer dated calls on media buying.
# Conflict rule: latest dated call wins; superseded advice kept as "⚠ was:". GAP: = missing in sources, don't invent.
updated: 2026-10-29
always: [foundations/house-rules.md]          # load for every copy/creative/page task

# Task bundles: shared by the ecom-* skills and council modes. kb = files, state = product files.
bundles:
  research:
    kb: [research/product-research.md, research/validation.md, research/competitor-store-review.md, foundations/sophistication-desire.md]
    state: [product.yaml, log.md]
  validate:
    kb: [research/validation.md, avatars/avatar-workflow.md]
    state: [product.yaml, avatars/, creatives.yaml]
  competitor:
    kb: [research/competitor-store-review.md, pages/offers.md, references/winning-stores.yaml]
    state: [product.yaml, offers.yaml]
  avatar:
    kb: [avatars/avatar-workflow.md, avatars/avatar-schema.yaml, research/validation.md, foundations/awareness.md]
    state: [product.yaml, avatars/]
  mechanism:
    kb: [angles/mechanisms.md, foundations/sophistication-desire.md]
    state: [product.yaml, avatars/, mechanism.yaml]
  desires:
    kb: [angles/desires.md, foundations/sophistication-desire.md, foundations/awareness.md]
    state: [product.yaml, avatars/<chosen>.yaml, desires.yaml]
  angles:
    kb: [angles/angles.md, foundations/awareness.md, foundations/house-rules.md]
    state: [product.yaml, avatars/<chosen>.yaml, desires.yaml, mechanism.yaml, angles.yaml, creatives.yaml]
  deconstruct:
    kb: [creative/ad-deconstruction.md, foundations/awareness.md, references/winning-ads.yaml]
    state: []
  script:
    kb: [creative/script-build.md, creative/script-standards.md, creative/hooks.md, foundations/awareness.md, foundations/house-rules.md, angles/mechanisms.md]
    state: [product.yaml, avatars/<chosen>.yaml, desires.yaml, mechanism.yaml, angles.yaml]
  script-check:
    kb: [creative/script-standards.md, foundations/awareness.md, foundations/house-rules.md]
    state: [product.yaml, avatars/<chosen>.yaml, mechanism.yaml]
  ad-copy:          # Meta primary text/headlines + native image long-form story
    kb: [creative/primary-text-headlines.md, creative/hooks.md, angles/angles.md, foundations/awareness.md, foundations/house-rules.md]
    state: [product.yaml, avatars/<chosen>.yaml, angles.yaml, offers.yaml]
  brief:
    kb: [creative/script-brief.md]
    state: [creatives.yaml]
  page:             # advertorial / listicle / PDP copy
    kb: [pages/landing-pages.md, pages/offers.md, foundations/awareness.md, foundations/house-rules.md, creative/hooks.md, references/reference-pages.yaml]
    state: [product.yaml, avatars/<chosen>.yaml, mechanism.yaml, angles.yaml, offers.yaml, pages.yaml]
  offer:
    kb: [pages/offers.md, references/winning-stores.yaml, media-buying/benchmarks.yaml]
    state: [product.yaml, offers.yaml, creatives.yaml]
  store-audit:
    kb: [pages/store-audit-checklist.md, pages/landing-pages.md, pages/offers.md, foundations/awareness.md, ops/email-retention.md, media-buying/benchmarks.yaml]
    state: [product.yaml, offers.yaml, pages.yaml, avatars/]
  media-buying:
    kb: [media-buying/testing.md, media-buying/scaling.md, media-buying/benchmarks.yaml, media-buying/account-ops.md, media-buying/growth-review.md]
    state: [product.yaml, creatives.yaml, offers.yaml, log.md]
  ops:
    kb: [ops/operations.md, ops/email-retention.md, references/tools.yaml]
    state: [log.md]

