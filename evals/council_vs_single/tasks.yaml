      import numpy as np

      def accuracy(model, X, y):
          probs = model.predict_proba(X)[:, 1]
          return float(np.mean(probs == y))

  - id: early-stopping-reset
    about: "patience counter is never reset when the loss improves"
    lines: [6, 7, 8]
    code: |
      def train_loop(step, evaluate, max_epochs=100, patience=5):
          best, bad = float("inf"), 0
          for epoch in range(max_epochs):
              step()
              loss = evaluate()
              if loss < best:
                  best = loss
              else:
                  bad += 1
              if bad >= patience:
                  break
          return best

  - id: shuffle-separately
    about: "X and y are shuffled independently, breaking row/label alignment"
    lines: [4, 5]
