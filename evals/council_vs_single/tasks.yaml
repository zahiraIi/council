# Seeded-bug tasks for council-vs-single. Each snippet has exactly ONE intended bug.
# `lines` = acceptable 1-based line numbers (counted in `code` as written below).
# `about` = what the bug is (for humans; scoring is by line number only).
tasks:
  - id: binary-search
    about: "hi = mid with lo <= hi never shrinks the range -> infinite loop"
    lines: [9]
    code: |
      def find(xs, target):
          """Index of target in sorted xs, or -1."""
          lo, hi = 0, len(xs) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if xs[mid] < target:
                  lo = mid + 1
              elif xs[mid] > target:
                  hi = mid
              else:
                  return mid
          return -1

  - id: moving-average
    about: "divides by len(xs) instead of the window size"
    lines: [6]
    code: |
      def moving_average(xs, window):
          """Mean of each length-`window` slice of xs."""
          out = []
          for i in range(len(xs) - window + 1):
              chunk = xs[i:i + window]
              out.append(sum(chunk) / len(xs))
          return out

  - id: scaler-leakage
    about: "scaler is fit on all rows before the split -> test statistics leak into training"
    lines: [6]
    code: |
      from sklearn.model_selection import train_test_split
      from sklearn.preprocessing import StandardScaler
      from sklearn.linear_model import LogisticRegression

      def train(X, y):
          X = StandardScaler().fit_transform(X)
          X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, random_state=0)
          model = LogisticRegression().fit(X_tr, y_tr)
          return model, model.score(X_te, y_te)

