[project]
name = "councilkg"
version = "0.1.0"
description = "Knowledge graph + hybrid search over the council KB and its sources (ATLAS-style)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "pyyaml>=6.0",
]

[project.scripts]
kg = "councilkg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["councilkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
