  customer: ""                 # who's been burned + what they now believe
  failed_solutions: []         # - {solution: "", why_failed: "", weakness_type: "", proof: ""}
  differentiators: []          # - {what: "", type: ingredient|process|delivery|product_type, edge: ""}
  statement: ""                # "While most [category] products [flaw], [Product] uses [x] to [advantage]. That's why..."
  checklist: {explains_failure: false, simple: false, true_provable: false, removal_test: false}
  hook_directions: []
  status: draft | chosen
