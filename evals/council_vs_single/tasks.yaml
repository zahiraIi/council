  - id: inclusive-date-range
    about: "range(days) omits the end date the docstring says is inclusive"
    lines: [5, 6]
    code: |
      from datetime import date, timedelta

      def days_between(start: date, end: date):
          """Every date from start to end, inclusive."""
          days = (end - start).days
          return [start + timedelta(d) for d in range(days)]

  - id: early-stop-on-test
    about: "model selection uses the TEST set; should use a validation split"
    lines: [7]
    code: |
      def select_model(candidates, X_tr, y_tr, X_val, y_val, X_te, y_te):
          """Pick the best candidate on validation data, report its test score."""
          best, best_score = None, -1.0
          for make in candidates:
              m = make()
              m.fit(X_tr, y_tr)
              score = m.score(X_te, y_te)
              if score > best_score:
                  best, best_score = m, score
          return best, best.score(X_te, y_te)

